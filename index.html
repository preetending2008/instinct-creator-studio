<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf8f5">
    <meta name="description" content="A practical, approval-first Instagram planning and analytics dashboard.">
    <title>Instinct — Instagram studio</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="Instinct home">
          <span class="brand-mark" aria-hidden="true">i.</span>
          <span>instinct<span class="brand-period">.</span></span>
        </a>
        <div class="workspace-label">CREATOR STUDIO</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span> Overview</button>
          <button class="nav-item" data-page="trends"><span class="nav-icon">↗</span> Trend radar <span class="nav-count" id="trend-count">0</span></button>
          <button class="nav-item" data-page="ideas"><span class="nav-icon">✳</span> Reel studio</button>
          <button class="nav-item" data-page="comments"><span class="nav-icon">◌</span> Comment drafts</button>
          <button class="nav-item" data-page="analytics"><span class="nav-icon">▥</span> Analytics</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="tip-card">
            <span class="tip-spark">✦</span>
            <p class="tip-title">Built for the long game</p>
            <p class="tip-copy">Use your own post results to learn what resonates. No algorithm promises.</p>
          </div>
          <button class="nav-item profile-nav" data-page="profile"><span class="nav-icon">◎</span> My creator profile</button>
          <div class="local-status"><span class="status-dot"></span> Your data stays in this browser</div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <button class="help-button" data-page="help" aria-label="Open user manual">Help &amp; manual</button>
            <button class="avatar-button" data-page="profile" aria-label="Open creator profile"><span id="avatar-initial">Y</span></button>
          </div>
        </header>
        <div class="page-content" id="page-content" aria-live="polite"></div>
        <footer class="app-footer">A thoughtful planning tool, not an Instagram connection. Trends, comments, and insights are based on what you enter.</footer>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
